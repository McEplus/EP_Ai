<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>军械库 · 选区材质工坊</title>
<style>
:root{font:14px "Segoe UI","Microsoft YaHei",sans-serif;color:#22272b;background:#f5f6f7;letter-spacing:0;--line:#dce1e4;--accent:#08796b}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{display:inline-flex;gap:7px;align-items:center;justify-content:center;border:1px solid #cbd2d6;border-radius:5px;background:#fff;padding:8px 12px;min-height:36px;cursor:pointer;color:inherit;white-space:nowrap}button:hover:not(:disabled){background:#edf4f2;border-color:#6faaa0}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.primary:hover:not(:disabled){background:#076254}button svg{width:17px;height:17px;flex-shrink:0}.icon{width:36px;padding:8px}.top{background:white;border-bottom:1px solid var(--line);padding:17px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}.title{font-size:20px;font-weight:650;margin:0}.version{font-size:12px;color:#657477;font-weight:400;margin-left:12px}.private{margin-left:auto;color:#5f726c;display:flex;align-items:center;gap:6px;font-size:12px}.private svg{width:15px;height:15px}.bar{padding:12px 24px;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.spacer{flex:1}.metrics{padding:12px 24px;display:flex;gap:25px;border-bottom:1px solid var(--line);font-size:12px;color:#687479}.metrics strong{font-size:17px;color:#25332f;margin-right:5px}.workspace{display:grid;grid-template-columns:minmax(350px,46%) minmax(0,1fr);min-height:calc(100vh - 175px)}.queue{background:#fff;border-right:1px solid var(--line);min-width:0}.queueHead{padding:14px 20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}h2{margin:0;font-size:14px;font-weight:600}.filter{margin-left:auto;max-width:170px;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:4px;width:45%}.files{max-height:calc(100vh - 230px);overflow:auto;min-height:260px}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}th{position:sticky;top:0;background:#f6f8f8;color:#62716e;font-weight:500;text-align:left;padding:10px 15px;border-bottom:1px solid var(--line);z-index:1}td{padding:12px 15px;border-bottom:1px solid #edf0f1;vertical-align:top;overflow-wrap:anywhere}th:nth-child(1){width:55%}th:nth-child(2){width:20%}tr.row{cursor:pointer}tr.row:hover{background:#f5f9f8}tr.active{background:#e9f4ef!important}.path{display:block;color:#86918e;font-size:11px;margin-top:4px}.status{font-weight:600;color:#4d6660}.error{color:#aa392f}.done{color:#08796b}.empty{padding:65px 20px;text-align:center;color:#8a9690;font-size:14px}.empty svg{display:block;width:38px;height:38px;margin:0 auto 15px;color:#a9b9b3}.preview{padding:20px;min-width:0}.previewHead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.previewHead h2{overflow-wrap:anywhere;flex:1;min-width:100px}.segments{display:flex;border:1px solid #cbd2d6;border-radius:5px;overflow:hidden}.segments button{border:0;border-right:1px solid #dce1e4;border-radius:0;font-size:12px;min-height:31px;padding:5px 11px}.segments button:last-child{border:0}.segments button[aria-pressed=true]{background:#253c36;color:#fff}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:18px}.controls select{padding:5px 7px;max-width:140px;background:white;border:1px solid var(--line);border-radius:4px}.controls label{display:flex;align-items:center;gap:7px}.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}.view{min-width:0}.caption{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#687671;margin-bottom:8px}.surface{height:340px;overflow:auto;display:flex;align-items:center;justify-content:center;background:#252a2e;border:1px solid #343c3c;border-radius:4px;position:relative}.surface canvas{image-rendering:pixelated;object-fit:contain;max-width:100%;max-height:100%;flex-shrink:0}.surface.full{align-items:flex-start;justify-content:flex-start}.surface.full canvas{max-width:none;max-height:none}.metadata{margin-top:18px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:9px;font-size:12px;line-height:1.5}.metadata dt{color:#75817b}.metadata dd{margin:0;overflow-wrap:anywhere}.notice{min-height:22px;color:#865d22;font-size:12px;margin:16px 0;white-space:pre-wrap;overflow-wrap:anywhere}.progress{height:3px;background:#dae6e0}.progress div{height:100%;background:var(--accent);width:0;transition:width .15s}footer{padding:14px 24px;display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);background:white;font-size:12px;color:#65736e}#message{flex:1;overflow-wrap:anywhere}.dropShade{display:none;position:fixed;inset:10px;border:3px dashed var(--accent);background:#eaf7f3ed;z-index:20;align-items:center;justify-content:center;font-size:23px;color:#086c5e;pointer-events:none}body.dragging .dropShade{display:flex}input[type=file]{display:none}.hidden{display:none!important}@media(max-width:900px){.workspace{grid-template-columns:1fr}.queue{border-right:0}.files{max-height:320px;min-height:150px}.surface{height:280px}.top,.bar,.metrics{padding-left:15px;padding-right:15px}.private{margin-left:0}.preview{padding:15px}}@media(max-width:460px){.version{display:none}.metrics{gap:16px;flex-wrap:wrap}.views{grid-template-columns:1fr}.surface{height:230px}.previewHead{align-items:flex-start}.segments{width:100%}.segments button{flex:1}.bar button{font-size:12px;padding:7px 10px}.spacer{display:none}.metadata{grid-template-columns:85px 1fr}.private{margin-left:auto}}
</style></head><body>
<header class="top"><h1 class="title">选区材质工坊<span class="version">军械库 / detail-v1</span></h1><span class="private"><i data-lucide="shield-check"></i>本地处理</span></header>
<div class="bar"><button id="addFiles"><i data-lucide="file-plus-2"></i>添加文件</button><button id="addFolder"><i data-lucide="folder-open"></i>添加文件夹</button><button id="clear" class="icon" title="清空列表" aria-label="清空列表"><i data-lucide="trash-2"></i></button><span class="spacer"></span><button id="run" class="primary" disabled><i data-lucide="play"></i>批量生成</button><button id="cancel" disabled><i data-lucide="square"></i>停止</button><button id="export" disabled><i data-lucide="archive"></i>导出 ZIP</button></div>
<div class="progress"><div id="progress"></div></div>
<div class="metrics"><span><strong id="total">0</strong>配对</span><span><strong id="ready">0</strong>待处理</span><span><strong id="completed">0</strong>已完成</span><span><strong id="abnormal">0</strong>需检查</span></div>
<main class="workspace"><section class="queue"><div class="queueHead"><h2>文件队列</h2><input id="filter" class="filter" aria-label="筛选文件" placeholder="筛选文件名"></div><div class="files"><table><thead><tr><th>选区图</th><th>尺寸</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty"><i data-lucide="images"></i>尚无文件</div></div></section>
<section class="preview"><div class="previewHead"><h2 id="selectedName">未选择文件</h2><button id="download" class="icon" disabled title="下载当前选区图" aria-label="下载当前选区图"><i data-lucide="download"></i></button></div><div class="controls"><div class="segments" id="modes"><button data-mode="mask" aria-pressed="false">选区</button><button data-mode="white" aria-pressed="true">纯白</button><button data-mode="gray" aria-pressed="false">中灰</button><button data-mode="red" aria-pressed="false">红色</button></div><label>选区<select id="region"><option value="-1">全部</option><option value="0">红</option><option value="1">绿</option><option value="2">蓝</option><option value="3">黄</option><option value="4">品红</option></select></label><label>缩放<select id="zoom"><option value="0">适应</option><option value="1">100%</option><option value="2">200%</option><option value="4">400%</option></select></label></div>
<div class="views"><div class="view"><div class="caption">原始图<span id="sourceSize"></span></div><div class="surface" id="leftSurface"><canvas id="sourceCanvas" width="1" height="1"></canvas></div></div><div class="view"><div class="caption">生成结果<span id="outputSize"></span></div><div class="surface" id="rightSurface"><canvas id="resultCanvas" width="1" height="1"></canvas></div></div></div>
<dl class="metadata"><dt>基础图</dt><dd id="basePath">—</dd><dt>选区图</dt><dd id="maskPath">—</dd><dt>输出</dt><dd id="outputPath">—</dd><dt>状态</dt><dd id="detailStatus">—</dd></dl><div class="notice" id="notice" role="status"></div></section></main>
<footer><span id="message" role="status">就绪</span><label><input id="keepPaths" type="checkbox" checked> 保留目录</label><button id="report" disabled><i data-lucide="file-json"></i>处理报告</button></footer>
<div class="dropShade">添加 PNG 文件或文件夹</div><input id="fileInput" type="file" multiple accept="image/png"><input id="folderInput" type="file" multiple webkitdirectory>
<!--PAKO--><!--UPNG--><!--JSZIP--><!--LUCIDE--><!--CORE--><!--APP-->
</body></html>
